name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project EarTalk.xcodeproj -scheme EarTalk -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EarTalk.app Payload/
          zip -r EarTalk.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EarTalk-ipa
          path: EarTalk.ipa
