name: EarTalk
options:
  bundleIdPrefix: com.example
targets:
  EarTalk:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [EarTalk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eartalk
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: EarTalk/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: EarTalk listens to conversations to transcribe them.
        NSSpeechRecognitionUsageDescription: EarTalk converts speech to text on your device.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
